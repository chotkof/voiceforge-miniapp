<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101721">
  <title>VoiceForge Studio</title>
  <link rel="preconnect" href="https://telegram.org">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="mark">VF</div>
      <div><p class="eyebrow">VOICEFORGE STUDIO</p><h1>Озвучь идею</h1></div>
      <span class="online"><i></i> онлайн</span>
    </header>

    <section class="card text-card">
      <div class="section-title"><label for="text">Текст для озвучки</label><span id="counter">0 / 1000</span></div>
      <textarea id="text" maxlength="1000" placeholder="Напишите текст так, как он должен прозвучать…"></textarea>
      <div class="hint">Совет: используйте короткие абзацы и знаки препинания — речь будет естественнее.</div>
    </section>

    <section class="card">
      <div class="section-title"><span>Голос</span><span class="choice" id="voiceChoice">Алиса</span></div>
      <div class="voice-grid" id="voices">
        <button class="voice selected" data-voice="warm"><b>🌸 Алиса</b><small>Мягкий</small></button>
        <button class="voice" data-voice="bright"><b>✨ Вера</b><small>Живой</small></button>
        <button class="voice" data-voice="deep"><b>🎙 Максим</b><small>Уверенный</small></button>
        <button class="voice" data-voice="neutral"><b>🗣 Андрей</b><small>Диктор</small></button>
      </div>
    </section>

    <section class="card">
      <div class="section-title"><span>Эмоциональность</span><span class="choice" id="emotionChoice">Нейтрально</span></div>
      <div class="chips" id="emotions">
        <button class="chip selected" data-emotion="neutral">😐 Нейтрально</button>
        <button class="chip" data-emotion="contentment">🌿 Спокойно</button>
        <button class="chip" data-emotion="happy">😊 Радостно</button>
        <button class="chip" data-emotion="enthusiasm">⚡ Энергично</button>
        <button class="chip" data-emotion="determination">💪 Уверенно</button>
        <button class="chip" data-emotion="anger">😠 Сердито</button>
        <button class="chip" data-emotion="sadness">😔 Грустно</button>
        <button class="chip" data-emotion="contemplation">🤔 Задумчиво</button>
      </div>
    </section>

    <section class="card speed-card">
      <div class="section-title"><span>Скорость речи</span><span class="choice" id="speedChoice">1.0×</span></div>
      <div class="segmented" id="speeds">
        <button class="selected" data-speed="1.0">Спокойно<br><b>1.0×</b></button>
        <button data-speed="1.2">Быстрее<br><b>1.2×</b></button>
        <button data-speed="1.35">Динамично<br><b>1.35×</b></button>
      </div>
    </section>

    <p class="notice">Аудио появится в чате с ботом. Лимиты и подписка применяются автоматически.</p>
    <button id="generate" class="generate"><span>🎙</span> Создать озвучку</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
